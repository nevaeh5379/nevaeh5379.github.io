<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM 번역기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <span class="title">LLM 번역기</span>
    <div class="actions">
      <button id="history-btn">기록</button>
      <button id="settings-btn">설정</button>
    </div>
  </header>

  <h1>LLM 번역기</h1>
  <p class="desc">OpenAI 호환 엔드포인트를 사용해 텍스트를 번역합니다.</p>

  <div class="controls">
    <select id="endpoint-select" title="엔드포인트"></select>
    <select id="model-select" title="모델"></select>
    <button id="refresh-models">새로고침</button>
    <label class="inline"><input type="checkbox" id="stream-toggle" checked> 스트리밍</label>
  </div>

  <div class="lang-row">
    <select id="source-lang"></select>
    <button class="swap-btn" id="swap-lang" title="언어 교환">⇄</button>
    <select id="target-lang"></select>
  </div>

  <div class="workspace">
    <div class="section input-col">
      <div class="section-header">
        <label for="input-text">입력</label>
        <span class="meta"><span id="char-count">0</span>자</span>
      </div>
      <div class="io-wrap">
        <textarea id="input-text" placeholder="번역할 텍스트를 입력하세요..."></textarea>
        <div class="io-tools">
          <button class="icon-btn" id="clear-input" title="지우기" aria-label="지우기">✕</button>
          <button class="icon-btn" id="paste-input" title="붙여넣기" aria-label="붙여넣기">⎘</button>
        </div>
      </div>
    </div>

    <div class="section output-col">
      <div class="section-header">
        <label for="output-text">출력</label>
        <span class="status-tag" id="status-tag"></span>
      </div>
      <div class="io-wrap">
        <div class="output-box" id="output-text"></div>
        <div class="io-tools">
          <button class="icon-btn" id="copy-output" title="복사" aria-label="복사">⧉</button>
          <button class="icon-btn" id="save-history" title="기록 저장" aria-label="기록 저장">⭳</button>
        </div>
      </div>
    </div>
  </div>

  <button class="translate-btn" id="translate-btn">번역하기</button>

  <details class="reasoning" id="reasoning-panel" style="display:none">
    <summary>추론 과정</summary>
    <div class="reasoning-body" id="reasoning-text"></div>
  </details>

  <footer>nevaeh5379.github.io</footer>

  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay"></div>

  <div class="modal" id="settings-modal">
    <div class="modal-header">
      <h2>설정</h2>
      <button data-close="settings">닫기</button>
    </div>
    <div class="modal-tabs">
      <button class="tab-btn active" data-tab="endpoints">엔드포인트</button>
      <button class="tab-btn" data-tab="model">모델 설정</button>
      <button class="tab-btn" data-tab="prompt">프롬프트</button>
      <button class="tab-btn" data-tab="export">내보내기</button>
    </div>
    <div class="modal-body">
      <div class="tab-pane active" data-pane="endpoints">
        <div id="endpoint-list"></div>
        <button id="add-endpoint">+ 엔드포인트 추가</button>
      </div>

      <div class="tab-pane" data-pane="model">
        <label class="inline" style="margin-bottom:0.6rem">
          <input type="checkbox" id="advanced-toggle"> 고급 모델 설정 사용
        </label>
        <div class="advanced-section disabled" id="advanced-section">
          <div class="range-row">
            <label>temperature</label>
            <input type="range" min="0" max="2" step="0.05" data-key="advanced.temperature">
            <span class="val" data-val="advanced.temperature"></span>
          </div>
          <div class="range-row">
            <label>top_p</label>
            <input type="range" min="0" max="1" step="0.01" data-key="advanced.top_p">
            <span class="val" data-val="advanced.top_p"></span>
          </div>
          <div class="range-row">
            <label>top_k</label>
            <input type="range" min="1" max="100" step="1" data-key="advanced.top_k">
            <span class="val" data-val="advanced.top_k"></span>
          </div>
          <div class="range-row">
            <label>repeat_penalty</label>
            <input type="range" min="0.5" max="2" step="0.05" data-key="advanced.repeat_penalty">
            <span class="val" data-val="advanced.repeat_penalty"></span>
          </div>
          <div class="range-row">
            <label>presence_penalty</label>
            <input type="range" min="-2" max="2" step="0.1" data-key="advanced.presence_penalty">
            <span class="val" data-val="advanced.presence_penalty"></span>
          </div>
          <div class="range-row">
            <label>frequency_penalty</label>
            <input type="range" min="-2" max="2" step="0.1" data-key="advanced.frequency_penalty">
            <span class="val" data-val="advanced.frequency_penalty"></span>
          </div>
        </div>
      </div>

      <div class="tab-pane" data-pane="prompt">
        <div class="form-group">
          <label>시스템 프롬프트</label>
          <textarea id="system-prompt"></textarea>
        </div>
        <div class="form-group">
          <label>유저 프롬프트</label>
          <textarea id="user-prompt"></textarea>
          <div class="hint">플레이스홀더: {source_lang} {target_lang} {text}</div>
        </div>
        <button id="reset-prompts">기본값으로 복원</button>
      </div>

      <div class="tab-pane" data-pane="export">
        <p class="desc">설정을 JSON 파일로 백업하거나 복원합니다. API 키가 포함되니 주의하세요.</p>
        <div class="section-actions">
          <button id="export-settings">설정 내보내기</button>
          <button id="import-settings">설정 가져오기</button>
          <input type="file" id="import-file" accept="application/json" hidden>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button data-close="settings">취소</button>
      <button id="save-settings">저장</button>
    </div>
  </div>

  <div class="sidebar" id="history-sidebar">
    <div class="sidebar-header">
      <h2>번역 기록</h2>
      <button data-close="history">닫기</button>
    </div>
    <div class="sidebar-search">
      <input type="text" id="history-search" placeholder="검색...">
    </div>
    <div class="sidebar-list" id="history-list"></div>
    <div class="sidebar-footer">
      <button class="danger" id="clear-history" style="width:100%">모든 기록 삭제</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
