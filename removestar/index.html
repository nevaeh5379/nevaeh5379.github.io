<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>** 없애기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 1rem 2rem;
      background: #fff;
      color: #111;
      line-height: 1.7;
      word-break: keep-all;
    }

    header {
      border-bottom: 2px solid #111;
      padding: 0.75rem 0;
      margin-bottom: 1.5rem;
    }
    header a { color: #111; text-decoration: none; font-weight: bold; }

    h1 { margin-bottom: 0.25rem; }
    p.desc { color: #888; margin-top: 0; margin-bottom: 1.5rem; font-size: 0.9rem; }

    label { display: block; font-weight: bold; margin-bottom: 0.25rem; }

    textarea {
      width: 100%;
      height: 220px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      padding: 0.75rem;
      resize: vertical;
      background: #fff;
      color: #111;
      line-height: 1.6;
    }

    .section { margin-bottom: 1rem; }

    .actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    button {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.4rem 1rem;
      background: #fff;
      color: #111;
      border: 1px solid #111;
      cursor: pointer;
    }
    button:hover { background: #111; color: #fff; }
    button:active { opacity: 0.8; }

    #copy-status {
      font-size: 0.85rem;
      color: #888;
      align-self: center;
    }

    footer {
      border-top: 1px solid #ccc;
      margin-top: 3rem;
      padding-top: 0.5rem;
      font-size: 0.8rem;
      color: #888;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #ddd; }
      header { border-bottom-color: #ddd; }
      header a { color: #ddd; }
      textarea { background: #252525; color: #ddd; border-color: #444; }
      button { background: #1a1a1a; color: #ddd; border-color: #aaa; }
      button:hover { background: #ddd; color: #1a1a1a; }
      footer { border-top-color: #444; color: #666; }
    }
  </style>
</head>
<body>
  <main>
    <h1>** 없애기</h1>

    <div class="section">
      <label for="input">입력</label>
      <textarea id="input" placeholder="여기에 텍스트를 붙여넣으세요..."></textarea>
    </div>

    <div class="section">
      <label for="output">출력</label>
      <textarea id="output" readonly></textarea>
      <div class="actions">
        <button id="copy-btn">복사</button>
        <span id="copy-status"></span>
      </div>
    </div>
  </main>
  <footer>nevaeh5379.github.io</footer>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copy-btn');
    const copyStatus = document.getElementById('copy-status');

    input.addEventListener('input', () => {
      output.value = input.value.replace(/\*\*/g, '');
    });

    copyBtn.addEventListener('click', () => {
      if (!output.value) return;
      navigator.clipboard.writeText(output.value).then(() => {
        copyStatus.textContent = '복사됨';
        setTimeout(() => { copyStatus.textContent = ''; }, 1500);
      });
    });
  </script>
</body>
</html>
